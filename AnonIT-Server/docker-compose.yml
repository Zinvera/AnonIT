version: '3.8'

services:
  anonit-server:
    build: .
    container_name: anonit-server
    restart: always
    ports:
      - "8765:8765"
    volumes:
      - anonit-data:/app/data
    environment:
      - ANONIT_HOST=0.0.0.0
      - ANONIT_PORT=8765
      - ANONIT_LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8765)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  anonit-data:
    driver: local
